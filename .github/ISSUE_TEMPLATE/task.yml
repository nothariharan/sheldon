name: Task
description: Claim one p0–p4 or eval item
title: "area: "
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - memory
        - retrieval
        - answers
        - coord
        - belief
        - eval
        - spikes
        - docs
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: TASKS.md id
      placeholder: p4-refute
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Copy the done-when cell, or say what changed.
    validations:
      required: true
