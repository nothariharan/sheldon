<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style><![CDATA[
      /* 1. THREE DOTS PULSE TO SIGNAL BEFORE CONNECTING (0% -> 14%) */
      @keyframes pulseDotV1 {
        0%, 5% { r: 8px; opacity: 0; stroke-width: 2.5px; }
        8% { r: 10px; opacity: 0.9; stroke-width: 2px; }
        24% { r: 30px; opacity: 0; stroke-width: 0.8px; }
        100% { opacity: 0; }
      }

      @keyframes pulseDotV3 {
        0%, 7% { r: 8px; opacity: 0; stroke-width: 2.5px; }
        10% { r: 10px; opacity: 0.9; stroke-width: 2px; }
        26% { r: 30px; opacity: 0; stroke-width: 0.8px; }
        100% { opacity: 0; }
      }

      /* 2. SOLID LINES ACTIVELY DRAW FROM V1 AND V3 TO MEET AT V2 (14% -> 42%) */
      @keyframes drawConnectingLine {
        0%, 12% {
          stroke-dashoffset: 140;
          opacity: 0.15;
        }
        16% {
          opacity: 1;
        }
        40%, 82% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        90%, 100% {
          stroke-dashoffset: 140;
          opacity: 0.15;
        }
      }

      /* 3. BASE CHORD CONNECTING V1 TO V3 (16% -> 42%) */
      @keyframes drawChord {
        0%, 14% {
          stroke-dashoffset: 150;
          opacity: 0;
        }
        18% {
          opacity: 0.55;
        }
        40%, 82% {
          stroke-dashoffset: 0;
          opacity: 0.55;
        }
        90%, 100% {
          stroke-dashoffset: 150;
          opacity: 0;
        }
      }

      /* 4. LEADING HEAD ON ADVANCING LINE (Gives distinct visual motion) */
      @keyframes leadBead {
        0%, 12% {
          stroke-dashoffset: 145;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        40% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        42%, 100% {
          opacity: 0;
        }
      }

      /* 5. APEX IMPACT SHOCKWAVE (detonates when lines meet at V2 at 40%) */
      @keyframes apexImpactWave {
        0%, 38% {
          r: 9px;
          opacity: 0;
          stroke-width: 3px;
        }
        41% {
          r: 12px;
          opacity: 1;
          stroke-width: 2.5px;
        }
        60% {
          r: 42px;
          opacity: 0;
          stroke-width: 0.8px;
        }
        100% {
          opacity: 0;
        }
      }

      /* 6. APEX CORE BURST UPON IMPACT */
      @keyframes apexCoreFlash {
        0%, 38% {
          transform: scale(1);
          fill: #FFFFFF;
        }
        41% {
          transform: scale(1.35);
          fill: #FFFFFF;
        }
        48% {
          transform: scale(1);
          fill: #FFFFFF;
        }
        100% {
          transform: scale(1);
        }
      }

      .anim-v1-pulse {
        animation: pulseDotV1 4.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        transform-origin: 0 0;
      }
      .anim-v3-pulse {
        animation: pulseDotV3 4.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        transform-origin: 0 0;
      }
      .anim-connect {
        stroke-dasharray: 140;
        animation: drawConnectingLine 4.4s cubic-bezier(0.2, 0.7, 0.3, 1) infinite;
      }
      .anim-chord {
        stroke-dasharray: 150;
        animation: drawChord 4.4s cubic-bezier(0.2, 0.7, 0.3, 1) infinite;
      }
      .anim-lead {
        stroke-dasharray: 20 140;
        animation: leadBead 4.4s cubic-bezier(0.2, 0.7, 0.3, 1) infinite;
      }
      .anim-apex-wave {
        animation: apexImpactWave 4.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        transform-origin: 0 0;
      }
      .anim-apex-core {
        animation: apexCoreFlash 4.4s ease-out infinite;
        transform-origin: 0 0;
      }
    ]]></style>
  </defs>

  <!-- Clean, Matte, Basic Carbon Background -->
  <rect x="6" y="6" width="1128" height="268" rx="18" ry="18" fill="#0D1117" stroke="#21262D" stroke-width="1.5" />

  <!-- =========================================================================
       "SHELDON" (BIG, BOLD, CRISP WHITE)
       ========================================================================= -->
  <path d="M 193.93 202.68 Q 180.99 202.68 171.33 198.14 Q 161.67 193.60 156.37 185.30 Q 151.09 176.98 151.09 165.72 L 175.61 165.72 Q 175.61 172.60 180.57 176.72 Q 185.53 180.84 193.93 180.84 Q 202.15 180.84 206.77 176.90 Q 211.39 172.94 211.39 166.40 Q 211.39 161.18 208.37 157.08 Q 205.35 152.96 199.47 151.60 L 184.51 148.08 Q 170.07 144.72 161.59 135.06 Q 153.11 125.40 153.11 111.96 Q 153.11 95.50 163.77 86.10 Q 174.43 76.68 192.91 76.68 Q 211.39 76.68 222.31 86.18 Q 233.23 95.66 233.23 111.80 L 208.71 111.80 Q 208.71 105.40 204.51 101.80 Q 200.31 98.18 192.91 98.18 Q 185.69 98.18 181.65 101.72 Q 177.63 105.24 177.63 111.12 Q 177.63 120.70 189.23 123.38 L 204.67 126.92 Q 219.13 130.10 227.61 140.78 Q 236.09 151.44 236.09 166.40 Q 236.09 177.32 230.97 185.56 Q 225.85 193.78 216.35 198.24 Q 206.87 202.68 193.93 202.68 Z M 255.07 201.00 L 255.07 78.36 L 280.27 78.36 L 280.27 126.08 L 308.51 126.08 L 308.51 78.36 L 333.71 78.36 L 333.71 201.00 L 308.51 201.00 L 308.51 148.76 L 280.27 148.76 L 280.27 201.00 L 255.07 201.00 Z M 358.23 201.00 L 358.23 78.36 L 433.83 78.36 L 433.83 100.20 L 382.93 100.20 L 382.93 127.76 L 427.95 127.76 L 427.95 148.58 L 382.93 148.58 L 382.93 179.16 L 433.83 179.16 L 433.83 201.00 L 358.23 201.00 Z M 464.91 201.00 L 464.91 78.36 L 490.11 78.36 L 490.11 178.32 L 539.67 178.32 L 539.67 201.00 L 464.91 201.00 Z M 556.97 201.00 L 556.97 78.36 L 596.79 78.36 Q 609.55 78.36 619.05 83.24 Q 628.55 88.10 633.83 96.92 Q 639.13 105.74 639.13 117.68 L 639.13 161.52 Q 639.13 173.28 633.83 182.18 Q 628.55 191.08 619.05 196.04 Q 609.55 201.00 596.79 201.00 L 556.97 201.00 Z M 582.17 178.32 L 596.79 178.32 Q 604.35 178.32 609.13 173.62 Q 613.93 168.92 613.93 161.52 L 613.93 117.68 Q 613.93 110.28 609.13 105.66 Q 604.35 101.04 596.79 101.04 L 582.17 101.04 L 582.17 178.32 Z M 697.59 202.68 Q 679.11 202.68 668.19 192.26 Q 657.27 181.84 657.27 164.04 L 657.27 115.32 Q 657.27 97.34 668.19 87.02 Q 679.11 76.68 697.59 76.68 Q 716.07 76.68 726.99 87.02 Q 737.91 97.34 737.91 115.32 L 737.91 164.04 Q 737.91 181.84 726.99 192.26 Q 716.07 202.68 697.59 202.68 Z M 697.59 180.84 Q 712.71 180.84 712.71 165.72 L 712.71 113.64 Q 712.71 98.52 697.59 98.52 Q 682.47 98.52 682.47 113.64 L 682.47 165.72 Q 682.47 180.84 697.59 180.84 Z M 758.07 201.00 L 758.07 78.36 L 787.47 78.36 L 819.23 173.28 Q 818.71 167.06 818.03 158.92 Q 817.37 150.76 816.95 142.62 Q 816.53 134.48 816.53 128.76 L 816.53 78.36 L 838.71 78.36 L 838.71 201.00 L 809.31 201.00 L 777.89 106.08 Q 778.39 111.46 778.89 118.86 Q 779.41 126.24 779.83 133.80 Q 780.25 141.36 780.25 147.24 L 780.25 201.00 L 758.07 201.00 Z" fill="#FFFFFF" />

  <!-- =========================================================================
       ">" FORMED BY JOINING THE THREE VERTICES (ANIMATED CONNECTION)
       ========================================================================= -->
  <g id="vertex-chevron">

    <!-- Faint Guide Trajectory (Shows the path before the dots connect) -->
    <g opacity="0.12" stroke="#FFFFFF" stroke-linecap="round">
      <line x1="878.81" y1="71.00" x2="996.81" y2="138.00" stroke-width="2.5" />
      <line x1="878.81" y1="211.00" x2="996.81" y2="138.00" stroke-width="2.5" />
      <line x1="878.81" y1="71.00" x2="878.81" y2="211.00" stroke-width="1.5" stroke-dasharray="4 4" />
    </g>

    <!-- Base Chord connecting Vertex 1 and Vertex 3 -->
    <line x1="878.81" y1="71.00" x2="878.81" y2="211.00" stroke="#6E7681" stroke-width="2" stroke-dasharray="4 4" class="anim-chord" />

    <!-- Solid, Smooth White Connecting Beams (V1 -> V2 and V3 -> V2) -->
    <line x1="878.81" y1="71.00" x2="996.81" y2="138.00" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" class="anim-connect" />
    <line x1="878.81" y1="211.00" x2="996.81" y2="138.00" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" class="anim-connect" />

    <!-- Leading Tip Bead (Visual marker leading the growing line) -->
    <line x1="878.81" y1="71.00" x2="996.81" y2="138.00" stroke="#E5E7EB" stroke-width="10" stroke-linecap="round" class="anim-lead" />
    <line x1="878.81" y1="211.00" x2="996.81" y2="138.00" stroke="#E5E7EB" stroke-width="10" stroke-linecap="round" class="anim-lead" />

    <!-- =======================================================================
         THE THREE PROMINENT VERTEX DOTS
         ======================================================================= -->

    <!-- VERTEX 1 (Top Dot) -->
    <g transform="translate(878.81, 71.00)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#FFFFFF" class="anim-v1-pulse" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#30363D" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
    </g>

    <!-- VERTEX 2 (Apex Dot: where the lines meet & form >) -->
    <g transform="translate(996.81, 138.00)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#FFFFFF" class="anim-apex-wave" />
      <circle cx="0" cy="0" r="15" fill="none" stroke="#30363D" stroke-width="2" />
      <circle cx="0" cy="0" r="9" fill="#FFFFFF" class="anim-apex-core" />
    </g>

    <!-- VERTEX 3 (Bottom Dot) -->
    <g transform="translate(878.81, 211.00)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#FFFFFF" class="anim-v1-pulse" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#30363D" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
    </g>

  </g>
</svg>
